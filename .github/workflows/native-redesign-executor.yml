name: Native redesign executor

on:
  push:
    branches:
      - feature/character-workspace-visual-redesign
    paths:
      - '.automation/run-*'

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve requested run
        id: request
        shell: bash
        run: |
          changed="$(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}' | grep '^\.automation/run-' | tail -n 1)"
          if [ -z "$changed" ]; then
            echo 'No run marker found.' >&2
            exit 1
          fi
          name="$(basename "$changed")"
          echo "marker=$name" >> "$GITHUB_OUTPUT"
          echo "Requested: $name"

      - name: Baseline test
        if: startsWith(steps.request.outputs.marker, 'run-baseline')
        run: npm test

      - name: Execute task script
        if: startsWith(steps.request.outputs.marker, 'run-task-')
        shell: bash
        run: |
          number="${{ steps.request.outputs.marker }}"
          number="${number#run-task-}"
          number="${number%%-*}"
          script=".automation/task-${number}.mjs"
          test -f "$script"
          node "$script" run

      - name: Commit task changes
        if: startsWith(steps.request.outputs.marker, 'run-task-')
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'Task script produced no working-tree changes.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          message="$(cat .automation/commit-message.txt)"
          git add -A ':!.automation' ':!.github/workflows/native-redesign-executor.yml'
          git commit -m "$message [skip ci]"
          git push origin HEAD:feature/character-workspace-visual-redesign
